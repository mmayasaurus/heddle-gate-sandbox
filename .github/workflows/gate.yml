name: Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions: {}
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: gate
    # [skip-gate] in the PR title makes this job SKIP → experiment A (does skipped satisfy?)
    if: ${{ github.event_name == 'push' || !contains(github.event.pull_request.title, '[skip-gate]') }}
    runs-on: ubuntu-latest
    steps:
      - name: event context (for the changes.base discriminator experiment)
        run: |
          echo "event=${{ github.event_name }} action=${{ github.event.action }}"
          echo "changes.base.ref.from=[${{ github.event.changes.base.ref.from }}]"
          echo "title=${{ github.event.pull_request.title }}"
      - name: verdict (title [fail] → red, [slow] → 40s then green, else green)
        run: |
          T="${{ github.event.pull_request.title }}"
          case "$T" in
            *"[fail]"*) echo "RED by title"; exit 1 ;;
            *"[slow]"*) echo "sleeping 40s"; sleep 40; echo "green after slow"; exit 0 ;;
            *) echo "GREEN"; exit 0 ;;
          esac
